apiVersion: v1
kind: ServiceAccount
metadata:
  name: manager-service-account
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manager-role
  namespace: default
rules:
# Allow the manager to create, list, and delete MapReduce Worker Jobs
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Allow the manager to list and monitor Worker Pods
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: manager-role-binding
  namespace: default
subjects:
- kind: ServiceAccount
  name: manager-service-account
  namespace: default
roleRef:
  kind: Role
  name: manager-role
  apiGroup: rbac.authorization.k8s.io