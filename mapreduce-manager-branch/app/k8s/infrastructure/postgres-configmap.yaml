apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
data:
  init-db.sql: |
    -- Drop old table to ensure a clean slate
    DROP TABLE IF EXISTS public.jobs;

    CREATE TABLE IF NOT EXISTS public.jobs (
        id UUID PRIMARY KEY,
        user_id UUID NOT NULL,
        status VARCHAR(50) NOT NULL DEFAULT 'SUBMITTED',
        format VARCHAR(50) NOT NULL,

        -- Multi-Tenant File Identifiers
        input_filename VARCHAR(255) NOT NULL,
        mapper_filename VARCHAR(255) NOT NULL,
        reducer_filename VARCHAR(255) NOT NULL,

        -- Dynamic Scaling & Progress Counters
        num_reducers INTEGER NOT NULL DEFAULT 3,
        num_mappers INTEGER DEFAULT NULL,
        total_chunks INTEGER NOT NULL DEFAULT 0,
        completed_map_chunks INTEGER NOT NULL DEFAULT 0,
        completed_reduce_chunks INTEGER NOT NULL DEFAULT 0,

        -- Audit Timestamps
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Trigger to automatically update the updated_at timestamp on row mutation
    CREATE OR REPLACE FUNCTION update_modified_column()
    RETURNS TRIGGER AS $$
    BEGIN
        NEW.updated_at = now();
        RETURN NEW;
    END;
    $$ language 'plpgsql';

    -- Optimize queries that filter by execution status
    CREATE INDEX idx_jobs_status ON public.jobs(status);

    CREATE TRIGGER update_jobs_modtime
        BEFORE UPDATE ON public.jobs
        FOR EACH ROW
        EXECUTE FUNCTION update_modified_column();