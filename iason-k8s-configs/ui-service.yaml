apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-service
  labels:
    app: ui-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ui-service
  template:
    metadata:
      labels:
        app: ui-service
    spec:
      containers:
      - name: ui-service
        image: ui-service:latest # Απλό όνομα, χωρίς username
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        # The values that I have at the .env of development
        - name: DATABASE_URL
          value: "postgresql+asyncpg://admin:DisSami26@postgres:5432/dds_db"
        - name: KEYCLOAK_SERVER_URL
          value: "http://keycloak:8080"
        - name: KEYCLOAK_REALM
          value: "myrealm"
        - name: KEYCLOAK_ADMIN_USER
          value: "admin"
        - name: KEYCLOAK_ADMIN_PASSWORD
          value: "admin"
        - name: KEYCLOAK_PUBLIC_KEY
          value: ""
        - name: MINIO_ENDPOINT
          value: "http://minio:9000"
        - name: MINIO_ACCESS_KEY
          value: "minioadmin"
        - name: MINIO_SECRET_KEY
          value: "minioadmin"
        - name: RABBITMQ_URL
          value: "amqp://guest:guest@rabbitmq:5672/"

---
apiVersion: v1
kind: Service
metadata:
  name: ui-service
spec:
  selector:
    app: ui-service
  ports:
    - protocol: TCP
      port: 80 # Η εξωτερική θύρα (π.χ. http://ui-service/)
      targetPort: 8000 # Η θύρα που ακούει το container
  type: LoadBalancer # Αυτό ενεργοποιεί το Load Balancing
